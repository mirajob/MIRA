<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIRA · Sei offline</title>
    <!-- Pagina servita dal service worker quando manca la rete: niente font o immagini da
         scaricare, altrimenti proprio qui non arriverebbero. -->
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4efe6;
        color: #0a1f33;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .box {
        max-width: 22rem;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: #0a1f33;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #48566a;
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: #fff;
        background: #0a1f33;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">M</div>
      <h1>Sei senza connessione</h1>
      <p>MIRA ha bisogno della rete per mostrarti la tua card e le associazioni. Riprova quando torni online.</p>
      <button onclick="location.reload()">Riprova</button>
    </div>
  </body>
</html>
